<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo circular suave -->
  <circle cx="100" cy="100" r="95" fill="#f5f0e8" stroke="#8B6914" stroke-width="2"/>

  <!-- Haste esquerda -->
  <line x1="18" y1="80" x2="45" y2="88" stroke="#6B4226" stroke-width="5" stroke-linecap="round"/>

  <!-- Haste direita -->
  <line x1="182" y1="80" x2="155" y2="88" stroke="#6B4226" stroke-width="5" stroke-linecap="round"/>

  <!-- Aro esquerdo -->
  <circle cx="65" cy="110" r="30" fill="none" stroke="#8B5E3C" stroke-width="7"/>

  <!-- Aro direito -->
  <circle cx="135" cy="110" r="30" fill="none" stroke="#8B5E3C" stroke-width="7"/>

  <!-- Ponte entre os aros -->
  <path d="M 95 105 Q 100 95 105 105" fill="none" stroke="#6B4226" stroke-width="5" stroke-linecap="round"/>

  <!-- Reflexo no aro esquerdo -->
  <path d="M 50 95 Q 55 88 65 86" fill="none" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Reflexo no aro direito -->
  <path d="M 120 95 Q 125 88 135 86" fill="none" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Gradiente subtil nos aros -->
  <defs>
    <radialGradient id="lensGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5E3C" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <!-- Preenchimento das lentes -->
  <circle cx="65" cy="110" r="26" fill="url(#lensGrad)"/>
  <circle cx="135" cy="110" r="26" fill="url(#lensGrad)"/>

  <!-- Brilho nas lentes -->
  <ellipse cx="55" cy="100" rx="8" ry="5" fill="white" opacity="0.3" transform="rotate(-20 55 100)"/>
  <ellipse cx="125" cy="100" rx="8" ry="5" fill="white" opacity="0.3" transform="rotate(-20 125 100)"/>
</svg>